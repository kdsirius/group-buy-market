<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小傅哥 - 拼团项目 - 商品详情页</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
<!-- 轮播图 -->
<div class="swiper-container">
  <div class="swiper-wrapper">
    <div class="swiper-slide"><img src="./images/sku-13811216-01.png"></div>
    <div class="swiper-slide"><img src="./images/sku-13811216-02.png"></div>
    <div class="swiper-slide"><img src="./images/sku-13811216-03.png"></div>
  </div>
  <div class="swiper-pagination"></div>
</div>

<!-- 商品信息 -->
<div class="product-info">
  <h1 class="product-title">手写MyBatis：渐进式源码实践（全彩）</h1>
  <span class="promotion-tag">大促优惠</span>
  <span class="promotion-text"></span>
  <p id="pageError" class="error-message"></p>
</div>

<!-- 后端返回 teamList 后，由 index.js 动态生成团卡片。 -->
<div class="group-list"></div>

<!-- 空白区域 -->
<div class="area"></div>

<!-- 底部操作栏 -->
<div class="action-bar">
  <button class="action-btn buy-alone">单独购买</button>
  <button class="action-btn group-buy">开团购买</button>
</div>

<!-- 支付弹窗 -->
<div id="paymentModal" class="modal">
  <div class="modal-content">
  <h2>模拟支付（不扣款）</h2>
  <p id="paymentAmount"></p>
  <p id="outTradeNo"></p>
  <p>本节只演示交互，支付完成会调用结算接口。</p>
    <div class="button-group">
      <button id="cancelPayment">取消支付</button>
      <button id="completePayment">完成演示</button>
    </div>
  </div>
</div>

<script src="js/index.js"></script>
</body>
</html>
